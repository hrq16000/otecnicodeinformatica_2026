name: PR401 - targeted critical transitive lock remediation

on:
  push:
    branches:
      - fix/security-dompurify-3417-20261031
    paths:
      - .github/workflows/pr401-one-shot-critical-transitives.yml

permissions:
  contents: write

concurrency:
  group: pr401-targeted-critical-transitives
  cancel-in-progress: false

jobs:
  patch-locks:
    if: github.repository == 'hrq16000/otecnicodeinformatica_2026'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated PR #401
        uses: actions/checkout@v4
        with:
          ref: fix/security-dompurify-3417-20261031
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Guard branch and initial dependency graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/security-dompurify-3417-20261031'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.dependencies['@tanstack/react-start'] !== '1.169.5' || pkg.dependencies['@tanstack/react-router'] !== '1.170.46' || pkg.dependencies['@tanstack/router-plugin'] !== '1.169.0') throw Error('TanStack baseline changed');
          if (lock.packages['node_modules/proxy-addr']?.version !== '2.0.7' || lock.packages['node_modules/shell-quote']?.version !== '1.10.0') throw Error('Critical transitive baseline changed');
          NODE
      - name: Update only vulnerable transitive resolutions via npm and Bun
        shell: bash
        run: |
          set -euo pipefail
          npm update proxy-addr shell-quote --package-lock-only --ignore-scripts --no-audit --no-fund
          bun update proxy-addr shell-quote --lockfile-only --ignore-scripts
          node <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const bun=fs.readFileSync('bun.lock','utf8');
          if (pkg.dependencies['@tanstack/react-start'] !== '1.169.5' || pkg.dependencies['@tanstack/react-router'] !== '1.170.46' || pkg.dependencies['@tanstack/router-plugin'] !== '1.169.0') throw Error('TanStack baseline changed');
          const proxy=lock.packages['node_modules/proxy-addr']?.version;
          const quote=lock.packages['node_modules/shell-quote']?.version;
          if (proxy !== '2.0.8' || !quote || quote.localeCompare('1.11.0', undefined, {numeric:true}) < 0) throw Error('Critical transitive resolution not patched: '+proxy+' / '+quote);
          if (!bun.includes('proxy-addr@2.0.8') || !bun.includes('shell-quote@'+quote)) throw Error('Bun lock misses patched transitive versions');
          console.log('Patched transitive resolutions:', 'proxy-addr',proxy,'shell-quote',quote);
          NODE
          git diff --check
          test "$(git diff --name-only | sort | paste -sd, -)" = 'bun.lock,package-lock.json'
      - name: Reproducible installations
        run: |
          npm ci --no-audit --no-fund
          bun install --frozen-lockfile --ignore-scripts
      - name: Validate automated tests and SSR build
        run: |
          npm run test:unit
          npm run test:list
          npm run build
      - name: Confirm zero critical findings and no increase in high
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/critical-audit.json" || true
          node <<'NODE'
          const a=require(process.env.RUNNER_TEMP+'/critical-audit.json');
          const v=a.metadata?.vulnerabilities ?? {};
          console.log('npm audit high:',v.high??'unknown','critical:',v.critical??'unknown');
          if (v.critical !== 0 || typeof v.high !== 'number' || v.high > 23) throw Error('Dependency audit not improved safely; do not commit');
          NODE
      - name: Commit only generated locks to isolated PR #401
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- package.json)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock package-lock.json
          test "$(git diff --cached --name-only | sort | paste -sd, -)" = 'bun.lock,package-lock.json'
          git diff --cached --check
          git commit -m 'fix(security): patch critical transitive lock resolutions with npm and Bun'
          git push origin HEAD:refs/heads/fix/security-dompurify-3417-20261031
