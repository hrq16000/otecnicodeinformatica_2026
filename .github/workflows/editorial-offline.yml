name: Editorial offline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: editorial-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editorial-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Sem secrets, .env, cliente Supabase ou chamadas de aplicação à rede.
      # Diagnóstico complementar: não substitui os gates globais de publicação.
      - run: npm run test:editorial:offline
      - name: Contratos de HTML e schemas (fixtures locais, sem rede)
        run: node --test scripts/lib/editorial-html-signals.test.mjs
