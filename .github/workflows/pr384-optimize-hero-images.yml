name: One-time PR384 responsive hero image generation
on:
  push:
    branches:
      - fix/seo-gate-producao-indexabilidade-20261014
    paths:
      - .github/workflows/pr384-optimize-hero-images.yml
permissions:
  contents: write
jobs:
  image-variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Generate optimized images from existing licensed source photos
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          node --input-type=module <<'NODE'
          import sharp from "sharp";
          import { stat } from "node:fs/promises";
          const variants = [
            { input: "public/fotos/bancada-tecnica.jpg", output: "public/fotos/bancada-tecnica-mobile.webp", width: 768 },
            { input: "public/fotos/estacao-trabalho.jpg", output: "public/fotos/estacao-trabalho-desktop.webp", width: 1280 },
          ];
          for (const { input, output, width } of variants) {
            await sharp(input).rotate().resize({ width, withoutEnlargement: true }).webp({ quality: 72, effort: 6 }).toFile(output);
            const a = await stat(input), b = await stat(output);
            if (!b.size || b.size >= a.size) throw Error(`Optimization did not reduce bytes: ${input}`);
            console.log(`${output}: ${a.size} -> ${b.size} bytes (${(100 * (1 - b.size / a.size)).toFixed(1)}% saved)`);
          }
          NODE
      - name: Commit only generated images
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/fotos/bancada-tecnica-mobile.webp public/fotos/estacao-trabalho-desktop.webp
          git commit -m "perf(images): generate lightweight hero WebP variants from licensed photos"
          git push origin "HEAD:${GITHUB_REF_NAME}"
