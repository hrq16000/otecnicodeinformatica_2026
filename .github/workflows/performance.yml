name: performance-servicos

# Budgets de performance por rota de serviço (Rodada 4F).
# Bloqueia o merge quando LCP, CLS ou TBT (proxy de INP em laboratório)
# regride acima do orçamento definido em lighthouserc.servicos.json.

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "vite.config.ts"
      - "lighthouserc.servicos.json"
      - ".github/workflows/performance.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SITE_DOMAIN: otecnicodeinformatica.com.br
          VITE_SITE_INDEXING_ENABLED: "true"
      - name: Smoke SSR do preview de produção
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/oti-preview.log /tmp/oti-preview-response.html
          npx --yes wrangler dev --config dist/server/wrangler.json --port 4173 > /tmp/oti-preview.log 2>&1 &
          preview_pid=$!
          cleanup() { kill "$preview_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:4173/; then
              break
            fi
            sleep 1
          done

          status="$(curl --silent --show-error --output /tmp/oti-preview-response.html --write-out '%{http_code}' http://127.0.0.1:4173/servicos/formatacao || true)"
          if [ "$status" != "200" ]; then
            echo "::error::Preview SSR retornou HTTP $status em /servicos/formatacao"
            echo "----- server log -----"
            cat /tmp/oti-preview.log || true
            echo "----- response -----"
            head -c 4000 /tmp/oti-preview-response.html || true
            echo
            exit 1
          fi

      - name: Lighthouse CI — budgets por rota de serviço
        # O próprio LHCI sobe o Worker gerado pelo preset cloudflare-module via Wrangler.
        # Não use vite dev/preview aqui: o bundle Nitro é dist/server/index.mjs.
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.servicos.json
      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-servicos
          path: reports/lhci-servicos
          if-no-files-found: ignore
