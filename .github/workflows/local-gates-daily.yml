name: Gates locais diários (SSR real)

# Execução agendada de TODOS os checks locais contra o SSR real, mais os gates
# novos da Micro-Rodada Local 1.2/2: similaridade de introdução (fail-closed) e
# schema das rotas /bairros/*. Também roda em pull_request para bloquear merge.
on:
  schedule:
    - cron: "10 6 * * *" # diário, 06:10 UTC (03:10 America/Sao_Paulo)
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates-locais:
    # O despacho manual na branch strict executa somente a prova negativa.
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/fix/restore-strict-observability-after-426-20261113' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_SITE_DOMAIN: otecnicodeinformatica.com.br
      VITE_SITE_INDEXING_ENABLED: "true"
      SSR_FORCE_REFRESH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci

      - name: Build (SSR + sitemaps)
        run: npm run build
        env:
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER }}

      - name: Auditoria de metadados
        run: npm run audit:seo

      - name: Todos os gates locais (SSR real, bloqueante)
        run: npm run gates:local

      - name: Diff de SEO local (evidência)
        if: always()
        run: node scripts/with-ssr-server.mjs npm run report:local-seo-diff

      - name: Status de indexação (Search Console)
        if: always()
        continue-on-error: true
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          GOOGLE_SEARCH_CONSOLE_API_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_API_KEY }}
          GSC_SITE_URL: sc-domain:otecnicodeinformatica.com.br
        run: npm run report:gsc-local

      - name: Acessibilidade do índice (TOC)
        if: always()
        continue-on-error: true
        run: npx playwright install --with-deps chromium && npx playwright test e2e/a11y-toc.spec.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gates-locais-diarios
          path: |
            reports/
            public/gsc-local-status.json

  # QA temporário: executar SOMENTE via Run workflow na branch strict.
  strict-observability-negative-qa:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/restore-strict-observability-after-426-20261113' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2e75bf0480e2fcaecde326be2a54d1c9b48b8498
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirmar contrato strict original
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { deployCheckSteps } from './scripts/pipelines.config.mjs';
          const scripts = JSON.parse(readFileSync('package.json', 'utf8')).scripts;
          if (scripts['check:observability-env:strict'] !== 'node scripts/check-observability-env.mjs --strict') process.exit(1);
          if (!deployCheckSteps.some((step) => step.script === 'check:observability-env:strict' && !step.optional)) process.exit(1);
          NODE
      - name: Provar bloqueio sem Sentry ou OTLP
        shell: bash
        run: |
          set -euo pipefail
          # Diretório vazio impede leitura acidental de .env e .env.production.
          isolated_dir="$(mktemp -d)"
          cd "$isolated_dir"
          set +e
          result="$(env -u VITE_SENTRY_DSN -u VITE_OTLP_ENDPOINT node "$GITHUB_WORKSPACE/scripts/check-observability-env.mjs" --strict 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$result"
          if [ "$code" -ne 1 ]; then
            echo "ERRO: strict deveria recusar sem destino (exit 1); recebido: $code"
            exit 1
          fi
          if ! printf '%s\n' "$result" | grep -Fq 'Defina VITE_SENTRY_DSN ou VITE_OTLP_ENDPOINT'; then
            echo "ERRO: falha não corresponde à ausência de destino real"
            exit 1
          fi
          echo "OK: strict falhou fechado, pelo motivo esperado."
