name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC re-scan to catch drift in dependencies.
    - cron: "0 6 * * 1"

# Evita que commits antigos da mesma PR continuem consumindo runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Dependency audit + secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 1) Fail the build on high/critical vulnerabilities de produção.
      - name: npm audit (high+critical)
        run: |
          set -e
          npm audit --omit=dev --audit-level=high --json > audit.json || true
          node - <<'NODE'
          const r = require("./audit.json");
          const m = r.metadata?.vulnerabilities || {};
          const rows = Object.entries(r.vulnerabilities || {})
            .filter(([, v]) => ["high", "critical"].includes(v.severity))
            .map(([name, v]) => ({
              name,
              severity: v.severity,
              direct: Boolean(v.isDirect),
              range: v.range,
              fix: v.fixAvailable === true
                ? "available"
                : v.fixAvailable && typeof v.fixAvailable === "object"
                  ? `${v.fixAvailable.name || name}@${v.fixAvailable.version || "?"}${v.fixAvailable.isSemVerMajor ? " (major)" : ""}`
                  : "none",
            }));
          console.log("high:", m.high || 0, "critical:", m.critical || 0);
          for (const row of rows) console.log(JSON.stringify(row));
          if ((m.high || 0) + (m.critical || 0) > 0) process.exit(1);
          NODE

      # 2) Block secrets in the exact tracked snapshot proposed by this commit.
      # Scanning the snapshot avoids inherited historical findings and node_modules,
      # while still failing if the code that would be merged contains a credential.
      - name: Gitleaks secret scan
        if: always()
        run: |
          set -euo pipefail
          rm -rf /tmp/gitleaks-tree
          mkdir -p /tmp/gitleaks-tree
          git archive HEAD | tar -x -C /tmp/gitleaks-tree
          timeout 8m docker run --rm \
            -v /tmp/gitleaks-tree:/repo:ro \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

      # 3) Static analysis on JS/TS.
      - name: Semgrep (OWASP/React rulesets)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/react

      # 4) Guard against regressions in security HTTP headers.
      - name: Verify security headers in public/_headers
        run: bun scripts/check-security-headers.ts

      # 5) Guard against tables shipping without RLS.
      - name: Verify every public-schema CREATE TABLE has RLS + GRANT
        run: bun scripts/check-rls-migrations.ts

      # 5b) Fail the build when finding SUPA_rls_policy_always_true reappears
      #     (RLS policy with a literal `true` USING / WITH CHECK predicate).
      - name: Guard SUPA_rls_policy_always_true
        run: node scripts/check-rls-always-true.mjs

      # 5c) Human-readable HTML summary of the security posture (uploaded below).
      #     Sai com código 1 quando qualquer internal_id monitorado está FOUND,
      #     bloqueando o merge (marque este job como required no branch protection).
      - name: Generate security scan HTML report (gate)
        id: security_report
        if: always()
        run: node scripts/report-security-scan.mjs

      # 5d) Notificação Slack quando qualquer internal_id monitorado é FOUND.
      - name: Notify Slack on monitored findings
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify-security-slack.mjs

      # 5e) Histórico versionado por commit: um artefato por execução.
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report-${{ github.sha }}-${{ github.run_number }}
          path: |
            reports/security-scan.html
            reports/security-scan-summary.json
          retention-days: 90

      - name: Fail the job when monitored findings were reported
        if: always() && steps.security_report.outcome == 'failure'
        run: |
          echo "::error::Relatório de segurança marcou internal_id(s) monitorado(s) como FOUND."
          node scripts/check-rls-always-true.mjs --explain || true
          exit 1



      # 6) Guard against SEO regressions on the landing shell (title / desc / unique H1).
      - name: Verify SEO basics on index.html
        run: bun scripts/check-seo-basics.ts index.html

      # 7) Runtime data-exposure gate. Não há fallback nem chave versionada.
      #    O próprio script faz SKIP seguro (exit 0) quando o ambiente não fornece
      #    as variáveis públicas; se elas existirem no CI, o gate roda normalmente.
      - name: Public data exposure gate (environment-aware)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-public-data-exposure.mjs

      # 8) Security-findings regression gate — fails if new findings appear for
      #    reviews or og_validation_status vs the committed baseline.
      - name: Security findings baseline (reviews + og_validation_status)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-security-findings-baseline.mjs


      # 9) Notificação (Slack/e-mail) em qualquer falha do job de segurança.
      - name: Notificar falha do pipeline de segurança
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PIPELINE_ALERT_EMAIL_TO: ${{ secrets.PIPELINE_ALERT_EMAIL_TO }}
          PIPELINE_ALERT_EMAIL_FROM: ${{ secrets.PIPELINE_ALERT_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/notify-pipeline-failure.mjs --contexto "Security (audit + gates)"
