name: Repair Bun lockfile after TanStack patch (PR 384 only)

on:
  push:
    branches:
      - fix/seo-gate-producao-indexabilidade-20261014
    paths:
      - .github/workflows/bun-lockfile-once.yml

permissions:
  contents: write

jobs:
  bun-lockfile:
    if: github.repository == 'hrq16000/otecnicodeinformatica_2026'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate Bun lockfile (no force)
        run: bun install --lockfile-only
      - name: Require frozen Bun lock and no manifest changes
        run: |
          git diff --exit-code -- package.json package-lock.json
          bun install --frozen-lockfile
      - name: Run official unit tests with patched TanStack API
        run: npm run test:unit
      - name: Commit validated bun.lock only
        run: |
          git add -- bun.lock
          if git diff --cached --quiet; then
            echo "Bun lock unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): sync Bun frozen lockfile after TanStack patch"
          git push origin HEAD:refs/heads/fix/seo-gate-producao-indexabilidade-20261014
