name: One-shot mobile LCP report
on:
  push:
    branches: [fix/seo-gate-producao-indexabilidade-20261014]
    paths:
      - .github/workflows/one-shot-mobile-lcp-report.yml
permissions:
  contents: read
jobs:
  mobile-lcp:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build SSR
        run: npm run build
      - name: Lighthouse mobile — one route, one run, raw diagnosis
        run: node scripts/run-lighthouse-audit.mjs --config=lighthouserc.mobile.json --smoke
      - name: Upload raw LCP and render-blocking audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-lcp-raw-smoke
          path: .lighthouseci-mobile/lhr-*.json
          if-no-files-found: warn
