name: PR401 - one-shot semver security lock remediation

on:
  push:
    branches:
      - fix/security-dompurify-3417-20261031
    paths:
      - .github/workflows/pr401-one-shot-semver-high-locks.yml

permissions:
  contents: write

concurrency:
  group: pr401-semver-high-locks
  cancel-in-progress: false

jobs:
  patch-locks:
    if: github.repository == 'hrq16000/otecnicodeinformatica_2026'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR401
        uses: actions/checkout@v4
        with:
          ref: fix/security-dompurify-3417-20261031
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Guard branch and approved starting graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/security-dompurify-3417-20261031'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const p=require('./package.json'),l=require('./package-lock.json');
          if (p.dependencies['@tanstack/react-start']!=='1.169.5' || p.dependencies['@tanstack/react-router']!=='1.170.46' || p.dependencies['@tanstack/router-plugin']!=='1.169.0') throw Error('TanStack baseline moved');
          if (l.packages['node_modules/proxy-addr']?.version!=='2.0.8' || l.packages['node_modules/shell-quote']?.version!=='1.12.0') throw Error('Critical patches not present');
          NODE
      - name: Regenerate semver-compatible fixes via npm and Bun
        shell: bash
        run: |
          set -euo pipefail
          npm update body-parser compression fast-uri js-yaml source-map-js undici vite brace-expansion launch-editor --package-lock-only --ignore-scripts --no-audit --no-fund
          bun update body-parser compression fast-uri js-yaml source-map-js undici vite brace-expansion launch-editor --lockfile-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const assert=require('node:assert/strict'), cp=require('node:child_process');
          const baseline=JSON.parse(cp.execFileSync('git',['show','HEAD:package.json'],{encoding:'utf8'}));
          const current=require('./package.json');
          if(baseline.devDependencies?.vite!=='^8.2.0' || !/^\^8\.3\.\d+$/.test(current.devDependencies?.vite||'')) throw Error('Vite semver bump out of approved ^8 range');
          assert.deepStrictEqual({...current,devDependencies:{...current.devDependencies,vite:baseline.devDependencies.vite}},baseline,'Only Vite semver-compatible direct range may change');
          NODE
          git diff --check
          test "$(git diff --name-only -- bun.lock package-lock.json package.json | sort | paste -sd, -)" = 'bun.lock,package-lock.json,package.json'
          node <<'NODE'
          const p=require('./package.json'), l=require('./package-lock.json'), fs=require('node:fs');
          if (p.dependencies['@tanstack/react-start']!=='1.169.5' || p.dependencies['@tanstack/react-router']!=='1.170.46') throw Error('TanStack changed');
          if (l.packages['node_modules/proxy-addr']?.version!=='2.0.8' || l.packages['node_modules/shell-quote']?.version!=='1.12.0') throw Error('Critical packages regressed');
          if (!fs.readFileSync('bun.lock','utf8').includes('proxy-addr@2.0.8')) throw Error('Bun critical patch missing');
          NODE
      - name: Reproduce npm and Bun installation
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          bun install --frozen-lockfile --ignore-scripts
      - name: Validate unit tests and SSR build; list E2E without touching real data
        shell: bash
        run: |
          set -euo pipefail
          npm run test:unit
          npm run test:list
          npm run build
      - name: Enforce security improvement without reducing audit gate
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/pr401-semver-audit.json" || true
          node <<'NODE'
          const data=require(process.env.RUNNER_TEMP+'/pr401-semver-audit.json');
          const v=data.metadata?.vulnerabilities ?? {};
          console.log('npm audit high:',v.high??'unknown','critical:',v.critical??'unknown');
          if (v.critical !== 0 || typeof v.high !== 'number' || v.high>=23) throw Error('No safe improvement: do not commit');
          NODE
      - name: Commit only approved manifest and generated lockfiles to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only -- bun.lock package-lock.json package.json | sort | paste -sd, -)" = 'bun.lock,package-lock.json,package.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock package-lock.json package.json
          test "$(git diff --cached --name-only | sort | paste -sd, -)" = 'bun.lock,package-lock.json,package.json'
          git diff --cached --check
          git commit -m 'fix(security): update compatible transitive patches via npm and Bun'
          git push origin HEAD:refs/heads/fix/security-dompurify-3417-20261031
