name: Refresh trust inventory (one-time branch job)

on:
  push:
    branches:
      - fix/trust-claims-copy-isolado-20261110
    paths:
      - .github/workflows/refresh-trust-inventory-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'hrq16000/otecnicodeinformatica_2026' && github.ref == 'refs/heads/fix/trust-claims-copy-isolado-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate official report (no dependencies or network)
        run: node scripts/report-trust-claims-panel.mjs
      - name: Verify official report
        run: node scripts/report-trust-claims-panel.mjs --check
      - name: Ensure only the generated inventory changes
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ "$changed" != "src/data/trustClaimsAudit.json" ]; then
            echo "::error::Unexpected generated diff: $changed"
            exit 1
          fi
          git diff --check
      - name: Commit inventory to this branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/trustClaimsAudit.json
          git commit -m 'chore(trust): refresh classified editorial inventory from official script'
          git push origin HEAD:fix/trust-claims-copy-isolado-20261110
