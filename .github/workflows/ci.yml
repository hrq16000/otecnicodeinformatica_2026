name: ci

on:
  push:
    branches: [main]
  pull_request:

# Mantém somente a execução mais recente de cada workflow por PR/ref.
# Commits superados deixam de consumir runner enquanto a PR evolui.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Camada 1 — testes de código (Vitest). Não sobe navegador, não builda.
  # Playwright NUNCA roda aqui; Vitest NUNCA coleta e2e/ (gate test:list).
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Inventário de testes (isolamento de runners, fail-closed)
        run: npm run test:list
      - name: Testes unitários (Vitest — projetos unit + scripts)
        run: npm run test:unit
      - name: Testes de integração (Vitest — jsdom)
        run: npm run test:integration
      - name: Testes de nó puro dos utilitários de borda
        run: npm run test:node-scripts
      - name: Inventário de testes (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-inventory
          path: reports/test-inventory.json
          if-no-files-found: warn

  build:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      # Observacional: evitar que um lint amplo congele os gates oficiais.
      # A checagem de formato continua registrada, sem esconder o retorno.
      - name: Lint (non-blocking warnings, bounded)
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 120s npm run lint --silent > lint-observacional.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::warning::Lint observacional excedeu 120 segundos (exit $status); consulte o artefato."
          elif [ "$status" -ne 0 ]; then
            echo "::warning::Lint observacional retornou exit $status; consulte o artefato."
          else
            echo "::notice::Lint observacional concluido."
          fi
          echo "Lint observacional (exit $status)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lint observacional
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-observacional
          path: lint-observacional.log
          if-no-files-found: ignore
      # Reproduzir o artefato exato do gate sem enfraquecer a checagem.
      - name: Regenerar inventário auditado de afirmações
        run: npm run report:afirmacoes
      - name: Exigir inventário de afirmações versionado atualizado
        run: git diff --exit-code -- src/data/trustClaimsAudit.json
      - name: Anexar inventário auditado para correção reproduzível
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-claims-inventory
          path: src/data/trustClaimsAudit.json
          if-no-files-found: warn
      # O build gera dist/ e sitemaps exigidos pela governança editorial.
      # Tanto Build quanto verify permanecem bloqueantes.
      - name: Build
        env:
          # Public client-side observability endpoints; never set fake values.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_OTLP_ENDPOINT: ${{ secrets.VITE_OTLP_ENDPOINT || vars.VITE_OTLP_ENDPOINT }}
        run: npm run build
      # Comando oficial: gates essenciais de código e conteúdo.
      # Os testes já rodam no job `unit`, por isso ficam de fora aqui.
      - name: verify (gates essenciais — comando oficial)
        run: npm run verify -- --skip=test
      # Comando oficial: gates essenciais de publicação (exigem dist/).
      # Os passos opcionais (GSC/rede) não bloqueiam o CI.
      - name: deploy:check (gates de publicação — comando oficial)
        env:
          # Fail-closed when neither configured endpoint exists.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_OTLP_ENDPOINT: ${{ secrets.VITE_OTLP_ENDPOINT || vars.VITE_OTLP_ENDPOINT }}
        run: npm run deploy:check
      # Gates de SEO com resumo anexado ao build (bloqueantes).
      - name: Gates de SEO (auditoria, descoberta, sitemap, robots)
        run: |
          set -o pipefail
          {
            echo "## Gates de SEO"
            echo ""
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          for gate in audit:seo check:content-discovery check:sitemap-source check:robots check:promocao-index; do
            saida="$(npm run --silent "$gate" 2>&1)" || status=1
            {
              echo "### $gate"
              echo "$saida" | tail -20
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Gates que dependem de servidor local e por isso ficam fora do orquestrador.
      - name: Interlinking local gate (mãe ⇄ bairros/cidades)
        run: node scripts/with-ssr-server.mjs npm run check:local-interlinking
      - name: Gate de saúde de indexação (rotas + aliases)
        run: |
          set -euo pipefail
          test -f dist/server/wrangler.json
          npx --yes wrangler@4.45.4 dev --config dist/server/wrangler.json --local --ip 127.0.0.1 --port 4321 > /tmp/ci-index-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:4321/; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/ci-index-worker.log; exit 1; fi
          node scripts/check-index-health.mjs --base=http://127.0.0.1:4321 --strict
      - name: Relatório HTML de auditoria local
        run: npm run report:local-audit

      - name: Upload relatórios dos comandos oficiais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: reports/pipeline-*.json
          if-no-files-found: warn


      - name: Upload relatório de auditoria local
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-audit-report
          path: reports/local-audit.html
          retention-days: 30

  e2e:
    # Playwright da versão travada no lockfile não suporta ubuntu26.04.
    # O runner explícito restaura a instalação real dos navegadores no CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # E2E possui build proprio; pode diagnosticar independentemente do gate
    # de observabilidade do build principal. Ambos seguem obrigatorios.
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        # The mobile project resolves to WebKit on this runner; install both.
        run: npx playwright install --with-deps chromium webkit
      - name: Build
        run: npm run build
      - name: Start production-like SSR Worker (local only)
        run: |
          npx --yes wrangler@4.45.4 dev --config dist/server/wrangler.json --local --ip 127.0.0.1 --port 8080 > /tmp/e2e-ssr-worker.log 2>&1 &
      - name: Wait for SSR HTML response (GET, not HEAD)
        run: |
          for i in $(seq 1 60); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 http://127.0.0.1:8080/ || true)"
            if [ "$status" = "200" ]; then
              echo "SSR homepage answered HTTP 200"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/e2e-ssr-worker.log
          echo "::error::SSR Worker did not return HTTP 200"
          exit 1
      - name: Run targeted E2E (whatsapp + termos + sitemap + como-funciona + segurança)
        run: npx playwright test e2e/whatsapp-funnel.spec.ts e2e/termos-e-condicoes.spec.ts e2e/seo-sitemap-robots.spec.ts e2e/como-funciona-mobile.spec.ts e2e/security-data-exposure.spec.ts
        env:
          E2E_BASE_URL: http://localhost:8080
          # Chaves públicas (anon) — o teste também tem fallback embutido.
          E2E_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Opcional: credenciais de um usuário de teste NÃO-admin (segredos de CI).
          # Se ausentes, o bloco autenticado é pulado (o bloco anon sempre roda).
          E2E_NONADMIN_EMAIL: ${{ secrets.E2E_NONADMIN_EMAIL }}
          E2E_NONADMIN_PASSWORD: ${{ secrets.E2E_NONADMIN_PASSWORD }}
      - name: Acessibilidade axe-core (páginas empresariais 3T/3U)
        run: npx playwright test e2e/a11y-empresarial.spec.ts
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Acessibilidade axe-core (rotas públicas — home, problemas, empresas, serviços)
        run: npx playwright test e2e/a11y-rotas-publicas.spec.ts
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Regressão visual com prefers-reduced-motion (sem animação, sem CLS)
        run: npx playwright test e2e/visual-reduced-motion.spec.ts --project=chromium
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Upload evidências de regressão visual (reduced-motion)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-reduced-motion
          path: test-results
          if-no-files-found: ignore


  e2e-full-matrix:
    # Suíte completa por navegador, PARTICIONADA em shards oficiais do Playwright.
    # OBSERVACIONAL: registra o baseline de cada engine sem bloquear o merge —
    # o gate bloqueante continua sendo o job `e2e`.
    name: e2e ${{ matrix.browser }} shard ${{ matrix.shard }}/${{ matrix.totalShards }} (observacional)
    # Evita a imagem ubuntu26.04, incompatível com o Chromium/WebKit/Firefox
    # suportados pela versão de Playwright fixada em package-lock.json.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: build
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
        totalShards: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser (${{ matrix.browser }})
        # Instalação oficial com dependências de sistema — sem LD_LIBRARY_PATH custom.
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build (uma única vez por job)
        run: npm run build
      - name: Start Cloudflare SSR worker
        run: npx --yes wrangler@4.45.4 dev --config dist/server/wrangler.json --local --ip 127.0.0.1 --port 8080 > /tmp/ci-matrix-worker.log 2>&1 &
      - name: Wait for SSR server (HTTP 200 mandatory)
        run: |
          if ! npx wait-on http-get://127.0.0.1:8080/ --timeout 90000; then
            cat /tmp/ci-matrix-worker.log
            exit 1
          fi
      - name: Run shard ${{ matrix.shard }}/${{ matrix.totalShards }} (${{ matrix.browser }})
        run: npx playwright test --config=playwright.ci.config.ts --shard=${{ matrix.shard }}/${{ matrix.totalShards }}
        env:
          PW_BROWSER: ${{ matrix.browser }}
          PW_REPORT_MODE: blob
          PW_SHARD_TAG: ${{ matrix.shard }}
          E2E_BASE_URL: http://localhost:8080
          E2E_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Rerun seletivo apenas das specs que falharam (evidência de flakiness)
        # Não substitui o resultado original: gera blob separado, claramente rotulado.
        if: failure()
        run: npx playwright test --config=playwright.ci.config.ts --last-failed
        continue-on-error: true
        env:
          PW_BROWSER: ${{ matrix.browser }}
          PW_REPORT_MODE: blob
          PW_SHARD_TAG: ${{ matrix.shard }}-rerun
          E2E_BASE_URL: http://localhost:8080
          E2E_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Upload blob report (${{ matrix.browser }}-${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload traces/screenshots (${{ matrix.browser }}-${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-matrix-report:
    # Consolida os blobs de todos os shards/engines. Roda mesmo com shards falhando,
    # mas NÃO converte falha em sucesso: o relatório mostra o resultado real.
    name: e2e matriz — relatório consolidado (observacional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: e2e-full-matrix
    # No shards = no blobs. Shard failures still produce a report; do not mask them.
    if: ${{ always() && needs.e2e-full-matrix.result != 'skipped' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          merge-multiple: false
          path: all-blob-artifacts
      - name: Collect blob files for Playwright merge (preserve shard evidence)
        run: |
          set -euo pipefail
          mkdir -p all-blob-reports
          mapfile -d '' files < <(find all-blob-artifacts -type f -name '*.zip' -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Nenhum blob Playwright entregue pelos shards."
            exit 1
          fi
          for index in "${!files[@]}"; do
            cp -- "${files[$index]}" "all-blob-reports/report-${index}.zip"
          done
          echo "Arquivos Playwright disponíveis para merge: ${#files[@]}"
      - name: Merge into HTML
        run: npx playwright merge-reports --reporter html ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: merged-report/html
      - name: Merge into JSON
        run: mkdir -p merged-report && npx playwright merge-reports --reporter json ./all-blob-reports > merged-report/results.json
      - name: Consolidar, deduplicar e classificar falhas
        run: node scripts/consolidate-e2e-failures.mjs merged-report/results.json --out merged-report/inventario-falhas.md
      - name: Resumo por navegador
        if: always()
        run: cat merged-report/inventario-falhas.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload relatório consolidado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-consolidado
          path: merged-report/
          retention-days: 14


  indexnow:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changes in service/neighborhood pages
        id: changes
        run: |
          set -e
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          changed=$(git diff --name-only "$base" HEAD || true)
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/pages/(servicos|bairros|arrumar-pc|servico-bairro|cftv|hubs)/|src/pages/Tecnico|src/pages/Conserto|src/pages/EmpresaDeTiCuritiba|src/lib/servicos(Core|Local)|public/sitemap)'; then
            echo "ping=true" >> "$GITHUB_OUTPUT"
          else
            echo "ping=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem mudanças em páginas de serviço/bairro/sitemap — IndexNow pulado."
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.ping == 'true'
        with:
          node-version: "22"
      - name: Ping IndexNow with sitemap URLs
        if: steps.changes.outputs.ping == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_HOST: otecnicodeinformatica.com.br
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::warning::INDEXNOW_KEY ausente — pulando ping."
            exit 0
          fi
          node scripts/indexnow-ping.mjs

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Lighthouse CI
        run: npm i -g @lhci/cli@0.13.x
      - name: Build
        run: npm run build
      - name: Lighthouse desktop (bloqueante)
        run: npm run lh:desktop
      - name: Lighthouse mobile (bloqueante)
        run: npm run lh:mobile
      - name: Resumo Lighthouse (LCP/CLS/TTFB/A11y)
        if: always()
        run: node scripts/report-lighthouse-summary.mjs
      - name: Budgets de performance (FCP/LCP/CLS/TTFB/TBT/INP/A11y)
        run: node scripts/check-performance-budgets.mjs
      - name: Regressão de LCP/CLS contra o baseline versionado
        run: npm run perf:regression
      - name: Upload resumo Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-summary
          path: reports/lighthouse-summary.*
          if-no-files-found: ignore
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          # Desktop e mobile têm diretórios distintos; publicar evidência de
          # ambos os gates para diagnosticar FCP/LCP sem execuções cegas.
          path: |
            .lighthouseci/
            .lighthouseci-mobile/
          if-no-files-found: error


