name: ci

on:
  push:
    branches: [main]
  pull_request:

# Mantém somente a execução mais recente de cada workflow por PR/ref.
# Commits superados deixam de consumir runner enquanto a PR evolui.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Camada 1 — testes de código (Vitest). Não sobe navegador, não builda.
  # Playwright NUNCA roda aqui; Vitest NUNCA coleta e2e/ (gate test:list).
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Inventário de testes (isolamento de runners, fail-closed)
        run: npm run test:list
      - name: Testes unitários (Vitest — projetos unit + scripts)
        run: npm run test:unit
      - name: Testes de integração (Vitest — jsdom)
        run: npm run test:integration
      - name: Testes de nó puro dos utilitários de borda
        run: npm run test:node-scripts
      - name: Inventário de testes (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-inventory
          path: reports/test-inventory.json
          if-no-files-found: warn

  build:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          # Supabase Realtime SSR requires native WebSocket in Node 22+.
          node-version: "22"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      # Advisory lint must not starve mandatory verify/build/deploy checks.
      # Exit remains non-blocking exactly as before; timeout is surfaced as warning.
      - name: Lint (non-blocking warnings)
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 120s npm run lint --silent
          result=$?
          if [ "$result" -eq 124 ] || [ "$result" -eq 137 ]; then
            echo "::warning::Advisory lint exceeded 120s; mandatory verify/build/deploy gates remain blocking."
          elif [ "$result" -ne 0 ]; then
            echo "::warning::Advisory lint reported findings (exit $result)."
          fi
          exit 0
      - name: Configuração opcional de observabilidade
        continue-on-error: true
        run: npm run check:observability-env
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || vars.VITE_SENTRY_DSN }}
          VITE_OTLP_ENDPOINT: ${{ secrets.VITE_OTLP_ENDPOINT || vars.VITE_OTLP_ENDPOINT }}
      # A governança editorial dentro de verify exige dist/ e sitemap gerados;
      # construir primeiro mantém os gates editoriais bloqueantes.
      - name: Build
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || vars.VITE_SENTRY_DSN }}
          VITE_OTLP_ENDPOINT: ${{ secrets.VITE_OTLP_ENDPOINT || vars.VITE_OTLP_ENDPOINT }}
      # Comando oficial: gates essenciais de código e conteúdo.
      # Os testes já rodam no job `unit`, por isso ficam de fora aqui.
      - name: verify (gates essenciais — comando oficial)
        run: npm run verify -- --skip=test
      # Comando oficial: gates essenciais de publicação (exigem dist/).
      # Os passos opcionais (GSC/rede) não bloqueiam o CI.
      - name: deploy:check (gates de publicação — comando oficial)
        run: npm run deploy:check
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || vars.VITE_SENTRY_DSN }}
          VITE_OTLP_ENDPOINT: ${{ secrets.VITE_OTLP_ENDPOINT || vars.VITE_OTLP_ENDPOINT }}
      # Gates de SEO com resumo anexado ao build (bloqueantes).
      - name: Gates de SEO (auditoria, descoberta, sitemap, robots)
        run: |
          set -o pipefail
          {
            echo "## Gates de SEO"
            echo ""
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          for gate in audit:seo check:content-discovery check:sitemap-source check:robots check:promocao-index; do
            saida="$(npm run --silent "$gate" 2>&1)" || status=1
            {
              echo "### $gate"
              echo "$saida" | tail -20
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Gates que dependem de servidor local e por isso ficam fora do orquestrador.
      - name: Interlinking local gate (mãe ⇄ bairros/cidades)
        run: node scripts/with-ssr-server.mjs npm run check:local-interlinking
      - name: Gate de saúde de indexação (rotas + aliases)
        run: |
          npm run preview -- --port 4321 &
          npx wait-on http-get://127.0.0.1:4321/ --timeout 90000
          node scripts/check-index-health.mjs --base=http://127.0.0.1:4321 --strict
      - name: Relatório HTML de auditoria local
        run: npm run report:local-audit

      - name: Upload relatórios dos comandos oficiais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: reports/pipeline-*.json
          if-no-files-found: warn


      - name: Upload relatório de auditoria local
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-audit-report
          path: reports/local-audit.html
          retention-days: 30

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # O job compila o próprio candidato; o gate de publicação strict continua
    # bloqueante no job build, sem impedir diagnóstico E2E independente.
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Build
        run: npm run build
      - name: Start preview
        run: npm run preview -- --port 8080 &
        env:
          CI: "true"
      - name: Wait for server
        run: npx wait-on http-get://127.0.0.1:8080/ --timeout 90000
      # Piloto isolado: diagnóstico não bloqueante; não modifica os gates E2E.
      - name: Agent Browser 0.43.0 smoke (preview local, sem credenciais)
        continue-on-error: true
        run: |
          set -euo pipefail
          pilot_dir="$RUNNER_TEMP/agent-browser-smoke"
          mkdir -p "$pilot_dir"
          npm install --prefix "$pilot_dir" --ignore-scripts --no-audit --no-fund --no-save agent-browser@0.43.0
          agent_browser="$pilot_dir/node_modules/.bin/agent-browser"
          chromium_path="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          "$agent_browser" --version
          "$agent_browser" --session oti-smoke --namespace oti-preview --executable-path "$chromium_path" --allowed-domains "127.0.0.1,localhost" open http://127.0.0.1:8080/
          "$agent_browser" --session oti-smoke --namespace oti-preview eval '(() => { if (location.origin !== "http://127.0.0.1:8080" || !document.title.trim()) throw new Error("preview local inválido"); return document.title; })()'
          "$agent_browser" --session oti-smoke --namespace oti-preview close
      # Reutiliza o Chromium do Playwright via CDP local: a VM Ubuntu não suporta o sandbox nativo de Chrome.
      # Nenhum URL público é visitado, nenhuma API/LLM é chamada e a telemetria está desligada.
      - name: Browser Use 1.0.5 smoke (CDP local e efêmero)
        continue-on-error: true
        env:
          ANONYMIZED_TELEMETRY: "false"
          BH_TELEMETRY: "0"
          BROWSER_USE_API_KEY: ""
        run: |
          set -euo pipefail
          pilot_dir="$RUNNER_TEMP/browser-use-105-smoke"
          python3 -m venv "$pilot_dir/venv"
          "$pilot_dir/venv/bin/python" -m pip install --disable-pip-version-check --no-input "browser-use==1.0.5"
          chromium_path="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          export BU_CHROMIUM_EXEC="$chromium_path"
          cd "$pilot_dir"
          "$pilot_dir/venv/bin/python" - <<'PY'
          import asyncio
          import importlib.metadata
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          from browser_use import Browser

          async def smoke():
              assert importlib.metadata.version("browser-use") == "1.0.5"
              with tempfile.TemporaryDirectory(prefix="browser-use-105-") as profile:
                  # Chrome sem sandbox SOMENTE nesta VM efêmera, em about:blank, com CDP no loopback.
                  chrome = subprocess.Popen(
                      [
                          os.environ["BU_CHROMIUM_EXEC"],
                          "--headless=new", "--no-sandbox", "--disable-gpu",
                          "--disable-dev-shm-usage",
                          "--remote-debugging-address=127.0.0.1",
                          "--remote-debugging-port=0",
                          f"--user-data-dir={profile}",
                          "about:blank",
                      ],
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  browser = None
                  try:
                      port_file = Path(profile) / "DevToolsActivePort"
                      for _ in range(150):
                          if port_file.is_file():
                              break
                          if chrome.poll() is not None:
                              raise RuntimeError("Chrome encerrou antes de criar o CDP local")
                          await asyncio.sleep(0.2)
                      else:
                          raise TimeoutError("Chrome não abriu o CDP local em 30 segundos")
                      port = int(port_file.read_text().splitlines()[0])
                      browser = Browser(
                          cdp_url=f"http://127.0.0.1:{port}",
                          allowed_domains=["127.0.0.1", "localhost"],
                      )
                      assert not browser.use_cloud
                      session = await asyncio.wait_for(browser.start(), timeout=30)
                      assert session, "Browser Use não abriu a sessão local"
                      print("BROWSER_USE_105_LOCAL_CDP_START_OK")
                  finally:
                      if browser is not None:
                          await browser.stop()
                      chrome.terminate()
                      try:
                          chrome.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          chrome.kill()
                          chrome.wait(timeout=5)
                  print("BROWSER_USE_105_LOCAL_CDP_STOP_OK")

          asyncio.run(smoke())
          PY
      - name: Run targeted E2E (whatsapp + termos + sitemap + como-funciona + segurança)
        run: npx playwright test e2e/whatsapp-funnel.spec.ts e2e/termos-e-condicoes.spec.ts e2e/seo-sitemap-robots.spec.ts e2e/como-funciona-mobile.spec.ts e2e/security-data-exposure.spec.ts
        env:
          E2E_BASE_URL: http://localhost:8080
          # Chaves públicas (anon) — o teste também tem fallback embutido.
          E2E_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Opcional: credenciais de um usuário de teste NÃO-admin (segredos de CI).
          # Se ausentes, o bloco autenticado é pulado (o bloco anon sempre roda).
          E2E_NONADMIN_EMAIL: ${{ secrets.E2E_NONADMIN_EMAIL }}
          E2E_NONADMIN_PASSWORD: ${{ secrets.E2E_NONADMIN_PASSWORD }}
      - name: Acessibilidade axe-core (páginas empresariais 3T/3U)
        run: npx playwright test e2e/a11y-empresarial.spec.ts
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Acessibilidade axe-core (rotas públicas — home, problemas, empresas, serviços)
        run: npx playwright test e2e/a11y-rotas-publicas.spec.ts
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Regressão visual com prefers-reduced-motion (sem animação, sem CLS)
        run: npx playwright test e2e/visual-reduced-motion.spec.ts --project=chromium
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Upload evidências de regressão visual (reduced-motion)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-reduced-motion
          path: test-results
          if-no-files-found: ignore


  e2e-full-matrix:
    # Suíte completa por navegador, PARTICIONADA em shards oficiais do Playwright.
    # OBSERVACIONAL: registra o baseline de cada engine sem bloquear o merge —
    # o gate bloqueante continua sendo o job `e2e`.
    name: e2e ${{ matrix.browser }} shard ${{ matrix.shard }}/${{ matrix.totalShards }} (observacional)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Só consome 12 shards quando o gate E2E menor estiver verde.
    needs: [build, e2e]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
        totalShards: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser (${{ matrix.browser }})
        # Instalação oficial com dependências de sistema — sem LD_LIBRARY_PATH custom.
        run: npx playwright install --with-deps ${{ matrix.browser }} webkit
      - name: Build (uma única vez por job)
        run: npm run build
      - name: Start preview
        run: npm run preview -- --port 8080 &
      - name: Wait for server (healthcheck HTTP)
        run: npx wait-on http-get://127.0.0.1:8080/ --timeout 90000
      - name: Run shard ${{ matrix.shard }}/${{ matrix.totalShards }} (${{ matrix.browser }})
        run: npx playwright test --config=playwright.ci.config.ts --shard=${{ matrix.shard }}/${{ matrix.totalShards }}
        env:
          PW_BROWSER: ${{ matrix.browser }}
          PW_REPORT_MODE: blob
          PW_SHARD_TAG: ${{ matrix.shard }}
          E2E_BASE_URL: http://localhost:8080
          E2E_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Rerun seletivo apenas das specs que falharam (evidência de flakiness)
        # Não substitui o resultado original: gera blob separado, claramente rotulado.
        if: failure()
        run: npx playwright test --config=playwright.ci.config.ts --last-failed
        continue-on-error: true
        env:
          PW_BROWSER: ${{ matrix.browser }}
          PW_REPORT_MODE: blob
          PW_SHARD_TAG: ${{ matrix.shard }}-rerun
          E2E_BASE_URL: http://localhost:8080
          E2E_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Upload blob report (${{ matrix.browser }}-${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload traces/screenshots (${{ matrix.browser }}-${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-matrix-report:
    # Consolida os blobs de todos os shards/engines. Roda mesmo com shards falhando,
    # mas NÃO converte falha em sucesso: o relatório mostra o resultado real.
    name: e2e matriz — relatório consolidado (observacional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: e2e-full-matrix
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          merge-multiple: true
          path: all-blob-reports
      - name: Preparar blobs para consolidação
        id: blobs
        run: |
          mkdir -p merged-report playwright-blob-flat
          count=0
          if [[ -d all-blob-reports ]]; then
            while IFS= read -r -d '' report; do
              count=$((count + 1))
              ln "$report" "playwright-blob-flat/report-$count.zip"
            done < <(find all-blob-reports -type f -name '*.zip' -print0)
          fi
          if [[ $count -gt 0 ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            printf '%s\n' '## Matriz E2E observacional' '' 'Nenhum relatório foi produzido. Confira os resultados dos jobs anteriores.' > merged-report/inventario-falhas.md
          fi
      - name: Merge into HTML
        if: steps.blobs.outputs.available == 'true'
        run: npx playwright merge-reports --reporter html ./playwright-blob-flat
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: merged-report/html
      - name: Merge into JSON
        if: steps.blobs.outputs.available == 'true'
        run: npx playwright merge-reports --reporter json ./playwright-blob-flat > merged-report/results.json
      - name: Consolidar, deduplicar e classificar falhas
        if: steps.blobs.outputs.available == 'true'
        run: node scripts/consolidate-e2e-failures.mjs merged-report/results.json --out merged-report/inventario-falhas.md
      - name: Resumo por navegador
        if: always() && hashFiles('merged-report/inventario-falhas.md') != ''
        run: cat merged-report/inventario-falhas.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload relatório consolidado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-consolidado
          path: merged-report/
          retention-days: 14


  indexnow:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changes in service/neighborhood pages
        id: changes
        run: |
          set -e
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          changed=$(git diff --name-only "$base" HEAD || true)
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/pages/(servicos|bairros|arrumar-pc|servico-bairro|cftv|hubs)/|src/pages/Tecnico|src/pages/Conserto|src/pages/EmpresaDeTiCuritiba|src/lib/servicos(Core|Local)|public/sitemap)'; then
            echo "ping=true" >> "$GITHUB_OUTPUT"
          else
            echo "ping=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem mudanças em páginas de serviço/bairro/sitemap — IndexNow pulado."
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.ping == 'true'
        with:
          node-version: "22"
      - name: Ping IndexNow with sitemap URLs
        if: steps.changes.outputs.ping == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_HOST: otecnicodeinformatica.com.br
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::warning::INDEXNOW_KEY ausente — pulando ping."
            exit 0
          fi
          node scripts/indexnow-ping.mjs

  lighthouse:
    runs-on: ubuntu-latest
    # Executa seu próprio build; diagnóstico não depende do deploy:check,
    # que permanece bloqueante na PR para segurança/publicação.
    needs: unit
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      # Lighthouse CI is installed from the npm/Bun-validated project lockfiles.
      # Do not install a fresh global release outside Bun's 24h age policy.
      - name: Build
        run: npm run build
      - name: Lighthouse desktop (bloqueante)
        run: npm run lh:desktop
      - name: Lighthouse mobile (bloqueante)
        run: npm run lh:mobile
      - name: Resumo Lighthouse (LCP/CLS/TTFB/A11y)
        if: always()
        run: node scripts/report-lighthouse-summary.mjs
      - name: Budgets de performance (FCP/LCP/CLS/TTFB/TBT/INP/A11y)
        run: node scripts/check-performance-budgets.mjs
      - name: Regressão de LCP/CLS contra o baseline versionado
        run: npm run perf:regression
      - name: Upload resumo Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-summary
          path: reports/lighthouse-summary.*
          if-no-files-found: ignore
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/
            .lighthouseci-mobile/
          include-hidden-files: true
          if-no-files-found: error


