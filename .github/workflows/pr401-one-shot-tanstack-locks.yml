name: PR401 - one-shot TanStack lock regeneration

on:
  push:
    branches:
      - fix/security-dompurify-3417-20261031
    paths:
      - .github/workflows/pr401-one-shot-tanstack-locks.yml

permissions:
  contents: write

concurrency:
  group: pr401-one-shot-tanstack-locks
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository == 'hrq16000/otecnicodeinformatica_2026'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR #401 branch
        uses: actions/checkout@v4
        with:
          ref: fix/security-dompurify-3417-20261031
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Guard original PR HEAD
        shell: bash
        run: |
          test "$(git branch --show-current)" = 'fix/security-dompurify-3417-20261031'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node -e 'const p=require("./package.json");if(p.dependencies["@tanstack/react-start"]!=="1.168.32")process.exit(1)'
      - name: Regenerate both lockfiles using package managers
        shell: bash
        run: |
          set -euo pipefail
          npm install @tanstack/react-start@1.169.5 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          bun install --lockfile-only --ignore-scripts
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const npmlock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const bunlock = fs.readFileSync('bun.lock','utf8');
          const version = '1.169.5';
          if (pkg.dependencies['@tanstack/react-start'] !== version || npmlock.packages['node_modules/@tanstack/react-start']?.version !== version || !/\"@tanstack\\/react-start\"\\s*:\\s*\"1\\.169\\.5\"/.test(bunlock)) throw Error('TanStack version mismatch across three files');
          const core = npmlock.packages['node_modules/@tanstack/start-server-core']?.version;
          if (!core || core.localeCompare('1.169.39', undefined, {numeric:true}) < 0) throw Error('Vulnerable start-server-core resolution: '+core);
          console.log('Package manifest/npm/Bun locks consistent; Start '+version+'; server core '+core);
          NODE
          git diff --check
          git diff --name-only | sort
          test "$(git diff --name-only | sort | paste -sd, -)" = 'bun.lock,package-lock.json,package.json'
      - name: Verify reproducible npm and Bun installations
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          bun install --frozen-lockfile --ignore-scripts
      - name: Unit tests and E2E inventory (no data writes)
        shell: bash
        run: |
          npm run test:unit
          npm run test:list
      - name: Audit improvement vs existing seven criticals (still blocks release)
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/pr401-audit.json" || true
          node -e 'const a=require(process.env.RUNNER_TEMP+"/pr401-audit.json");const v=a.metadata?.vulnerabilities||{};console.log("audit high:",v.high||0,"critical:",v.critical||0);if((v.critical??99)>=7)process.exit(1)'
      - name: Commit only coherent generated dependency files to PR #401
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort | paste -sd, -)" = 'bun.lock,package-lock.json,package.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json bun.lock
          git diff --cached --check
          git commit -m 'fix(security): update TanStack Start and regenerate npm/Bun locks'
          git push origin HEAD:refs/heads/fix/security-dompurify-3417-20261031
