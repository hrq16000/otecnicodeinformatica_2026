name: PR401 - one-shot remaining high dependency remediation

on:
  push:
    branches:
      - fix/security-dompurify-3417-20261031
    paths:
      - .github/workflows/pr401-one-shot-high-major-audit.yml

permissions:
  contents: write

concurrency:
  group: pr401-high-major-audit
  cancel-in-progress: false

jobs:
  patch-major:
    if: github.repository == 'hrq16000/otecnicodeinformatica_2026'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout existing PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/security-dompurify-3417-20261031
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Guard exact source SHA and vulnerable package ranges
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/security-dompurify-3417-20261031'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const p=require('./package.json'),l=require('./package-lock.json');
          if (p.devDependencies?.['@lhci/cli']!=='^0.15.1' || p.devDependencies?.sharp!=='^0.34.5') throw Error('Package baseline moved; stop');
          if (l.packages['node_modules/@lhci/cli']?.version!=='0.15.1' || l.packages['node_modules/sharp']?.version!=='0.34.5') throw Error('Lock baseline moved; stop');
          if (p.dependencies?.['@tanstack/react-start']!=='1.169.5') throw Error('TanStack security baseline moved; stop');
          NODE
      - name: Update only two audited vulnerable direct tools through npm and Bun
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact @lhci/cli@0.16.1 sharp@0.35.5 --package-lock-only --ignore-scripts --no-audit --no-fund
          bun install --lockfile-only --ignore-scripts
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),cp=require('node:child_process');
          const before=JSON.parse(cp.execFileSync('git',['show','HEAD:package.json'],{encoding:'utf8'}));
          const now=require('./package.json');
          assert.equal(now.devDependencies['@lhci/cli'],'0.16.1');
          assert.equal(now.devDependencies.sharp,'0.35.5');
          assert.deepStrictEqual({...now,devDependencies:{...now.devDependencies,'@lhci/cli':before.devDependencies['@lhci/cli'],sharp:before.devDependencies.sharp}},before,'Unapproved direct dependency change');
          const npm=require('./package-lock.json');
          if(npm.packages['node_modules/@lhci/cli']?.version!=='0.16.1'||npm.packages['node_modules/sharp']?.version!=='0.35.5')throw Error('npm lock did not upgrade direct dependencies');
          const bun=fs.readFileSync('bun.lock','utf8');
          if(!bun.includes('@lhci/cli@0.16.1')||!bun.includes('sharp@0.35.5'))throw Error('Bun lock missed direct upgraded tools');
          NODE
          git diff --check
          test "$(git diff --name-only | sort | paste -sd, -)" = 'bun.lock,package-lock.json,package.json'
      - name: Verify both official lockfiles with clean installations
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          bun install --frozen-lockfile --ignore-scripts
      - name: Validate unit tests, Playwright inventory, and SSR
        shell: bash
        run: |
          set -euo pipefail
          npm run test:unit
          npm run test:list
          npm run build
      - name: Block commit if audit does not improve, or critical findings reappear
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/pr401-high-major-audit.json" || true
          node <<'NODE'
          const a=require(process.env.RUNNER_TEMP+'/pr401-high-major-audit.json');
          const v=a.metadata?.vulnerabilities||{};
          console.log('npm audit high:',v.high??'unknown','critical:',v.critical??'unknown');
          for(const [name,data] of Object.entries(a.vulnerabilities||{})){
            if(data.severity==='high'||data.severity==='critical')console.log(name+': '+data.severity);
          }
          if(v.critical!==0||typeof v.high!=='number'||v.high>=14)throw Error('High findings did not decrease safely: no commit');
          NODE
      - name: Commit only officially generated dependency files to PR 401
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock package-lock.json package.json
          test "$(git diff --cached --name-only | sort | paste -sd, -)" = 'bun.lock,package-lock.json,package.json'
          git diff --cached --check
          git commit -m 'fix(security): patch Lighthouse CI and Sharp high dependencies via npm and Bun'
          git push origin HEAD:refs/heads/fix/security-dompurify-3417-20261031
