name: One-shot mobile LCP diagnosis
on:
  push:
    branches: [fix/seo-gate-producao-indexabilidade-20261014]
    paths:
      - .github/workflows/one-shot-mobile-lcp-diagnosis.yml
permissions:
  contents: read
jobs:
  mobile-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Profile only homepage under original mobile throttle
        run: node scripts/run-lighthouse-audit.mjs --config=lighthouserc.mobile.json --smoke
      - name: Print FCP, LCP and resource diagnostics
        if: always()
        run: |
          node --input-type=module <<'EOF'
          import { readdirSync, readFileSync } from "node:fs";
          const dir=".lighthouseci-mobile";
          for (const f of readdirSync(dir).filter(f=>f.endsWith(".json"))) {
            const r=JSON.parse(readFileSync(dir+"/"+f,"utf8"));
            const audits=r.audits;
            console.log(JSON.stringify({
              url:r.finalDisplayedUrl,
              timing:Object.fromEntries(["server-response-time","first-contentful-paint","largest-contentful-paint","speed-index","total-blocking-time","render-blocking-resources"].map(id=>[id,{value:audits[id]?.numericValue,details:audits[id]?.details?.items?.slice(0,5)}])),
              lcpElement:audits["largest-contentful-paint-element"]?.details?.items?.slice(0,3),
              lcpBreakdown:audits["lcp-breakdown-insight"]?.details?.items?.slice(0,8),
              criticalRequestChain:audits["network-dependency-tree-insight"]?.details?.items?.slice(0,5),
              diagnostics:audits.diagnostics?.details?.items?.slice(0,2),
              resourceSummary:audits["resource-summary"]?.details?.items?.slice(0,16)
            },null,2));
          }
          EOF
      - name: Save original JSON for precise diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-lcp-single-route
          path: .lighthouseci-mobile/*.json
          if-no-files-found: warn
